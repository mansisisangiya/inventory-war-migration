<mat-card>
  <div class="header">
    <h1>Items</h1>
    <a mat-raised-button color="primary" routerLink="/items/new" data-test="add">Add item</a>
  </div>

  <table mat-table [dataSource]="items$" class="items-table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let item" data-test="cell-name">{{ item.name }}</td>
    </ng-container>
    <ng-container matColumnDef="quantity">
      <th mat-header-cell *matHeaderCellDef>Qty</th>
      <td mat-cell *matCellDef="let item">{{ item.quantity }}</td>
    </ng-container>
    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>Price</th>
      <td mat-cell *matCellDef="let item">{{ item.price | currency:'EUR' }}</td>
    </ng-container>
    <ng-container matColumnDef="edit">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let item" class="edit">
        <a mat-button color="primary" [routerLink]="['/items', item.id, 'edit']" data-test="edit">Edit</a>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns" data-test="item-row"></tr>
  </table>
</mat-card>
