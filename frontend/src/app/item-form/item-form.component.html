<mat-card>
  <h1>{{ itemId === null ? 'Add item' : 'Edit item' }}</h1>

  <form [formGroup]="form" (ngSubmit)="save()">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" data-test="name">
      <mat-error>Name is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Quantity</mat-label>
      <input matInput type="number" formControlName="quantity" data-test="quantity">
      <mat-error>Must be 0 or more</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Price (EUR)</mat-label>
      <input matInput type="number" step="0.01" formControlName="price" data-test="price">
      <mat-error>Must be 0 or more</mat-error>
    </mat-form-field>

    <div class="buttons">
      <a mat-button routerLink="/items">Cancel</a>
      <button mat-raised-button color="primary" type="submit" data-test="save">Save</button>
    </div>
  </form>
</mat-card>
